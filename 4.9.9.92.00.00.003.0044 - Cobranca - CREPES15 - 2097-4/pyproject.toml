[project]
name = "conciliacao"
version = "0.1.0"
description = "Conciliação de bases a partir de um catálogo de scripts SQL."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas",
    "openpyxl",
    "SQLAlchemy",
    "python-dotenv",
    "PyYAML",
    "oracledb",
    "pyodbc",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
conciliacao = "conciliacao.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
